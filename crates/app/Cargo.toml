[package]
name = "typst-live"
version.workspace = true
edition.workspace = true
description = "typst-engine 的 GPUI 外壳：实时 Typst 预览器"

[[bin]]
name = "typst-live"
path = "src/main.rs"

[dependencies]
# gpui 版本锁定：与 wu / jicheng 完全一致的组合（已在那些项目验证过）
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "1505b1487131adbb443f6c69e87847db35bfa2d1" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "1505b1487131adbb443f6c69e87847db35bfa2d1" }

# 引擎
typst-engine = { path = "../engine" }
typst = { workspace = true }
typst-layout = { workspace = true }

# 编辑器里的 Typst 语法高亮（gpui-component 自带的语言集里没有 typst）
codebook-tree-sitter-typst = "0.12.1"

# 必须与 gpui 的 image 版本**严格一致**：`RenderImage::new` 收的是
# `image::Frame`，版本不同就是两个不同类型，编译不过。
# 版本号取自 zed workspace 根 Cargo.toml（image = "0.25.1"）。
image = { version = "0.25.1", default-features = false }

# 终端：Zed 同款终端核心（wu 用的同一个 crate）。自带 pty。
alacritty_terminal = "0.26"

# AI 编辑：请求体/响应 JSON 解析。HTTP 本身走系统 curl，不引重型 HTTP 客户端
# （与 wu 同一条路子）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# finder 的扫描测试要造临时目录
tempfile = "3"
